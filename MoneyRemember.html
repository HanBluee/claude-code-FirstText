
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微型记账本</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --color-income: #10b981;
    --color-income-bg: #ecfdf5;
    --color-expense: #ef4444;
    --color-expense-bg: #fef2f2;
    --color-bg: #f1f5f9;
    --color-card: #ffffff;
    --color-text: #1e293b;
    --color-muted: #94a3b8;
    --color-border: #e2e8f0;
    --radius: 14px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
  }

  /* ── 主容器，移动端优先，最大宽度限制 ── */
  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-bottom: 32px;
  }

  /* ── 标题 ── */
  .app-header {
    text-align: center;
    padding: 8px 0;
  }

  .app-header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .app-header .month-label {
    font-size: 13px;
    color: var(--color-muted);
    margin-top: 2px;
  }

  /* ── 月度汇总卡片 ── */
  .summary {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

  .summary-card {
    background: var(--color-card);
    border-radius: var(--radius);
    padding: 16px 12px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }

  .summary-card .label {
    font-size: 12px;
    color: var(--color-muted);
    margin-bottom: 6px;
  }

  .summary-card .value {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .summary-card.income .value { color: var(--color-income); }
  .summary-card.expense .value { color: var(--color-expense); }
  .summary-card.balance .value { color: #3b82f6; }

  /* ── 表单卡片 ── */
  .form-card {
    background: var(--color-card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }

  .form-card h2 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .form-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  /* 金额输入 —— 大号醒目 */
  .input-amount {
    flex: 1;
    font-size: 28px;
    font-weight: 700;
    padding: 10px 14px;
    border: 2px solid var(--color-border);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.25s;
    color: var(--color-text);
    background: #f8fafc;
    min-width: 0;
  }

  .input-amount:focus { border-color: #3b82f6; }

  .input-amount::placeholder { color: #cbd5e1; font-weight: 400; font-size: 18px; }

  /* 收入/支出 切换按钮 */
  .type-toggle {
    display: flex;
    gap: 0;
    background: #f1f5f9;
    border-radius: 12px;
    padding: 3px;
  }

  .type-btn {
    flex: 1;
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    background: transparent;
    color: var(--color-muted);
    white-space: nowrap;
  }

  .type-btn.selected-income {
    background: var(--color-income);
    color: #fff;
  }

  .type-btn.selected-expense {
    background: var(--color-expense);
    color: #fff;
  }

  /* 分类选择 */
  .input-select {
    flex: 1;
    padding: 10px 12px;
    border: 2px solid var(--color-border);
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    background: #f8fafc;
    color: var(--color-text);
    transition: border-color 0.25s;
    cursor: pointer;
    min-width: 0;
  }

  .input-select:focus { border-color: #3b82f6; }

  .input-date {
    padding: 10px 12px;
    border: 2px solid var(--color-border);
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    background: #f8fafc;
    color: var(--color-text);
    transition: border-color 0.25s;
    cursor: pointer;
  }

  .input-date:focus { border-color: #3b82f6; }

  .input-note {
    flex: 1;
    padding: 10px 12px;
    border: 2px solid var(--color-border);
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    background: #f8fafc;
    color: var(--color-text);
    transition: border-color 0.25s;
    min-width: 0;
  }

  .input-note:focus { border-color: #3b82f6; }
  .input-note::placeholder { color: #cbd5e1; }

  .btn-submit {
    width: 100%;
    padding: 12px;
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 1px;
  }

  .btn-submit:hover { background: #2563eb; }
  .btn-submit:active { transform: scale(0.97); }

  /* ── 图表卡片 ── */
  .chart-card {
    background: var(--color-card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }

  .chart-card h2 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .chart-wrapper {
    position: relative;
    max-width: 280px;
    margin: 0 auto;
  }

  .chart-empty {
    text-align: center;
    color: var(--color-muted);
    font-size: 14px;
    padding: 40px 0;
  }

  /* ── 记录列表 ── */
  .records-card {
    background: var(--color-card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }

  .records-card h2 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .record-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--color-border);
  }

  .record-item:last-child { border-bottom: none; }

  /* 左侧：分类图标 */
  .record-cat {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  /* 中间：分类名 + 日期 + 备注 */
  .record-info {
    flex: 1;
    min-width: 0;
  }

  .record-info .cat-name {
    font-size: 14px;
    font-weight: 600;
  }

  .record-info .meta {
    font-size: 12px;
    color: var(--color-muted);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 右侧：金额 + 删除 */
  .record-right {
    text-align: right;
    flex-shrink: 0;
  }

  .record-amount {
    font-size: 16px;
    font-weight: 700;
  }

  .record-amount.income { color: var(--color-income); }
  .record-amount.expense { color: var(--color-expense); }

  .btn-delete {
    background: transparent;
    border: none;
    color: #cbd5e1;
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
    transition: color 0.2s;
    margin-top: 2px;
  }

  .btn-delete:hover { color: var(--color-expense); }

  .records-empty {
    text-align: center;
    color: var(--color-muted);
    font-size: 14px;
    padding: 32px 0;
  }
</style>
</head>
<body>
<div class="app">
  <!-- ═══ 标题 ═══ -->
  <div class="app-header">
    <h1>微型记账本</h1>
    <div class="month-label" id="monthLabel"></div>
  </div>

  <!-- ═══ 月度汇总 ═══ -->
  <div class="summary">
    <div class="summary-card income">
      <div class="label">本月收入</div>
      <div class="value" id="sumIncome">¥0</div>
    </div>
    <div class="summary-card expense">
      <div class="label">本月支出</div>
      <div class="value" id="sumExpense">¥0</div>
    </div>
    <div class="summary-card balance">
      <div class="label">本月结余</div>
      <div class="value" id="sumBalance">¥0</div>
    </div>
  </div>

  <!-- ═══ 添加记录表单 ═══ -->
  <div class="form-card">
    <h2>添加记录</h2>

    <!-- 金额 + 收入/支出切换 -->
    <div class="form-row">
      <input type="number" class="input-amount" id="inputAmount"
        placeholder="0.00" step="0.01" min="0.01" onkeydown="if(event.key==='Enter')addRecord()">
      <div class="type-toggle" id="typeToggle">
        <button class="type-btn selected-expense" data-type="expense">支出</button>
        <button class="type-btn" data-type="income">收入</button>
      </div>
    </div>

    <!-- 分类 + 日期 -->
    <div class="form-row">
      <select class="input-select" id="inputCategory">
        <option value="餐饮">餐饮</option>
        <option value="交通">交通</option>
        <option value="购物">购物</option>
        <option value="娱乐">娱乐</option>
        <option value="其他">其他</option>
      </select>
      <input type="date" class="input-date" id="inputDate">
    </div>

    <!-- 备注 + 添加按钮 -->
    <div class="form-row">
      <input type="text" class="input-note" id="inputNote"
        placeholder="备注（可选）" maxlength="30" onkeydown="if(event.key==='Enter')addRecord()">
    </div>

    <button class="btn-submit" onclick="addRecord()">添加记录</button>
  </div>

  <!-- ═══ 分类支出饼图 ═══ -->
  <div class="chart-card">
    <h2>本月支出分类</h2>
    <div class="chart-wrapper">
      <canvas id="pieChart"></canvas>
    </div>
    <div class="chart-empty" id="chartEmpty" style="display:none">暂无支出数据</div>
  </div>

  <!-- ═══ 记录列表 ═══ -->
  <div class="records-card">
    <h2>全部记录</h2>
    <div id="recordsList">
      <div class="records-empty">暂无记录</div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   常量 & DOM 引用
   ═══════════════════════════════════════════ */
const STORAGE_KEY = 'finance-records';

// 分类配置：图标背景色和图表颜色
const CATEGORY_CONFIG = {
  '餐饮': { icon: '🍜', color: '#f59e0b' },
  '交通': { icon: '🚌', color: '#3b82f6' },
  '购物': { icon: '🛒', color: '#ec4899' },
  '娱乐': { icon: '🎬', color: '#8b5cf6' },
  '其他': { icon: '📌', color: '#6b7280' },
};

const $ = (id) => document.getElementById(id);

const el = {
  monthLabel: $('monthLabel'),
  sumIncome: $('sumIncome'),
  sumExpense: $('sumExpense'),
  sumBalance: $('sumBalance'),
  inputAmount: $('inputAmount'),
  inputCategory: $('inputCategory'),
  inputDate: $('inputDate'),
  inputNote: $('inputNote'),
  typeToggle: $('typeToggle'),
  recordsList: $('recordsList'),
  chartEmpty: $('chartEmpty'),
};

/* ═══════════════════════════════════════════
   状态
   ═══════════════════════════════════════════ */
// records: [{ id, amount, type, category, date, note }]
let records = [];
let recordType = 'expense';  // 当前表单选中的类型
let chartInstance = null;    // Chart.js 实例引用

/* ═══════════════════════════════════════════
   工具函数
   ═══════════════════════════════════════════ */

// 格式化金额：保留两位小数，千分位逗号
function formatMoney(num) {
  return '¥' + Number(num).toLocaleString('zh-CN', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });
}

// 获取本月的 YYYY-MM 字符串，如 "2026-05"
function currentMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

// 判断一条记录是否属于本月
function isCurrentMonth(record) {
  return record.date.startsWith(currentMonth());
}

// 防止 XSS
function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ═══════════════════════════════════════════
   localStorage 持久化
   ═══════════════════════════════════════════ */

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) records = JSON.parse(raw);
  } catch (_) { /* 数据损坏时从空开始 */ }
}

/* ═══════════════════════════════════════════
   表单操作
   ═══════════════════════════════════════════ */

// 初始化表单日期为今天
function initFormDate() {
  el.inputDate.value = new Date().toISOString().slice(0, 10);
}

// 类型切换按钮事件（事件委托）
el.typeToggle.addEventListener('click', (e) => {
  const btn = e.target.closest('.type-btn');
  if (!btn) return;
  recordType = btn.dataset.type;
  // 更新按钮高亮样式
  el.typeToggle.querySelectorAll('.type-btn').forEach(b => {
    b.classList.remove('selected-income', 'selected-expense');
    if (b.dataset.type === 'income') b.classList.add('selected-income');
    else b.classList.add('selected-expense');
    // 未选中的按钮去掉高亮
    if (b !== btn) {
      b.classList.remove('selected-income', 'selected-expense');
    }
  });
  // 重新设置正确的高亮
  el.typeToggle.querySelectorAll('.type-btn').forEach(b => {
    b.classList.remove('selected-income', 'selected-expense');
  });
  if (btn.dataset.type === 'income') {
    btn.classList.add('selected-income');
  } else {
    btn.classList.add('selected-expense');
  }
});

function addRecord() {
  const amount = parseFloat(el.inputAmount.value);
  if (isNaN(amount) || amount <= 0) {
    el.inputAmount.focus();
    return;
  }

  records.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    amount: Math.round(amount * 100) / 100, // 避免浮点精度问题
    type: recordType,
    category: el.inputCategory.value,
    date: el.inputDate.value,
    note: el.inputNote.value.trim(),
  });

  // 按日期倒序排列
  records.sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

  // 清空表单
  el.inputAmount.value = '';
  el.inputNote.value = '';
  el.inputAmount.focus();

  refreshAll();
}

/* ═══════════════════════════════════════════
   月度汇总计算 & 渲染
   ═══════════════════════════════════════════ */

function updateSummary() {
  const monthRecords = records.filter(isCurrentMonth);

  let totalIncome = 0;
  let totalExpense = 0;
  monthRecords.forEach(r => {
    if (r.type === 'income') totalIncome += r.amount;
    else totalExpense += r.amount;
  });

  el.sumIncome.textContent = formatMoney(totalIncome);
  el.sumExpense.textContent = formatMoney(totalExpense);
  el.sumBalance.textContent = formatMoney(totalIncome - totalExpense);

  // 月份标签
  const d = new Date();
  el.monthLabel.textContent = d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
}

/* ═══════════════════════════════════════════
   Chart.js 饼图
   ═══════════════════════════════════════════ */

function updateChart() {
  // 统计本月各分类支出
  const monthRecords = records.filter(r => isCurrentMonth(r) && r.type === 'expense');
  const categoryTotals = {};
  monthRecords.forEach(r => {
    categoryTotals[r.category] = (categoryTotals[r.category] || 0) + r.amount;
  });

  const categories = Object.keys(categoryTotals);
  const dataValues = Object.values(categoryTotals);

  // 无支出时隐藏图表，显示提示
  if (categories.length === 0) {
    el.chartEmpty.style.display = 'block';
    document.querySelector('.chart-wrapper').style.display = 'none';
    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    return;
  }

  el.chartEmpty.style.display = 'none';
  document.querySelector('.chart-wrapper').style.display = 'block';

  const ctx = document.getElementById('pieChart').getContext('2d');

  // 销毁旧图表再重建
  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: categories,
      datasets: [{
        data: dataValues,
        backgroundColor: categories.map(c => CATEGORY_CONFIG[c]?.color || '#999'),
        borderWidth: 2,
        borderColor: '#fff',
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            padding: 16,
            usePointStyle: true,
            pointStyleWidth: 10,
            font: { size: 13 },
          },
        },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const total = dataValues.reduce((s, v) => s + v, 0);
              const pct = total > 0 ? Math.round(ctx.raw / total * 100) : 0;
              return ` ${ctx.label}: ${formatMoney(ctx.raw)} (${pct}%)`;
            },
          },
        },
      },
    },
  });
}

/* ═══════════════════════════════════════════
   记录列表渲染
   ═══════════════════════════════════════════ */

function renderRecords() {
  el.recordsList.innerHTML = '';

  if (records.length === 0) {
    el.recordsList.innerHTML = '<div class="records-empty">暂无记录，添加一条吧</div>';
    return;
  }

  records.forEach(r => {
    const cat = CATEGORY_CONFIG[r.category] || CATEGORY_CONFIG['其他'];
    const isIncome = r.type === 'income';
    const sign = isIncome ? '+' : '-';

    const item = document.createElement('div');
    item.className = 'record-item';
    item.innerHTML =
      `<div class="record-cat" style="background:${cat.color}20;color:${cat.color}">${cat.icon}</div>` +
      `<div class="record-info">` +
        `<div class="cat-name">${escapeHTML(r.category)}</div>` +
        `<div class="meta">${r.date}${r.note ? ' · ' + escapeHTML(r.note) : ''}</div>` +
      `</div>` +
      `<div class="record-right">` +
        `<div class="record-amount ${isIncome ? 'income' : 'expense'}">${sign}${formatMoney(r.amount)}</div>` +
        `<button class="btn-delete" onclick="deleteRecord('${r.id}')" title="删除">×</button>` +
      `</div>`;
    el.recordsList.appendChild(item);
  });
}

/* ═══════════════════════════════════════════
   删除记录
   ═══════════════════════════════════════════ */

function deleteRecord(id) {
  records = records.filter(r => r.id !== id);
  refreshAll();
}

/* ═══════════════════════════════════════════
   全局刷新：汇总 → 图表 → 列表 → 落盘
   ═══════════════════════════════════════════ */

function refreshAll() {
  updateSummary();
  updateChart();
  renderRecords();
  saveState();
}

/* ═══════════════════════════════════════════
   初始化
   ═══════════════════════════════════════════ */
loadState();
initFormDate();
refreshAll();
</script>
</body>
</html>
